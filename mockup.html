  }

  h1 { text-align: center; }
  .bar { text-align: right; }

&lt;h1&gt;To Do&lt;/h1&gt;
&lt;form id=&quot;form&quot;&gt;
  &lt;input type=&quot;text&quot; id=&quot;input&quot; placeholder=&quot;New item&quot; autocomplete=&quot;off&quot;&gt;
  &lt;select id=&quot;category&quot; title=&quot;Category&quot;&gt;&lt;/select&gt;
  &lt;input type=&quot;date&quot; id=&quot;due&quot; title=&quot;Due date (optional)&quot;&gt;
  &lt;button type=&quot;submit&quot;&gt;Add&lt;/button&gt;
&lt;/form&gt;
&lt;div id=&quot;list&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  var CATEGORIES = [&#39;Work&#39;, &#39;Personal&#39;, &#39;Others&#39;];

  // ---- theme ----
  var themeSel = document.getElementById(&#39;theme&#39;);
  var theme = null;
  try { theme = localStorage.getItem(&#39;theme&#39;); } catch (e) {}
  if (theme !== &#39;light&#39; &amp;&amp; theme !== &#39;dark&#39;) {
    theme = window.matchMedia &amp;&amp; matchMedia(&#39;(prefers-color-scheme: dark)&#39;).matches ? &#39;dark&#39; : &#39;light&#39;;
  }
  function applyTheme() {
    document.documentElement.setAttribute(&#39;data-theme&#39;, theme);
    // show the icon of the mode you would switch to
    themeSel.textContent = theme === &#39;dark&#39; ? &#39;☀️&#39; : &#39;🌙&#39;;
    var label = theme === &#39;dark&#39; ? &#39;Switch to light mode&#39; : &#39;Switch to dark mode&#39;;
    themeSel.title = label;
    themeSel.setAttribute(&#39;aria-label&#39;, label);
  }
  themeSel.onclick = function () {
    theme = theme === &#39;dark&#39; ? &#39;light&#39; : &#39;dark&#39;;
    try { localStorage.setItem(&#39;theme&#39;, theme); } catch (e) {}
    applyTheme();
  };
  applyTheme();

  // ---- data ----
  var todos = [];
  try { todos = JSON.parse(localStorage.getItem(&#39;todos&#39;)) || []; } catch (e) {}
  // older items may have free-text categories; anything not in the list becomes &quot;Others&quot;
  todos.forEach(function (t) {
    if (CATEGORIES.indexOf(t.category) &lt; 0) t.category = &#39;Others&#39;;
    t.due = t.due || &#39;&#39;;
  });

  var editing = null; // the todo object being edited
  var list = document.getElementById(&#39;list&#39;);
  var input = document.getElementById(&#39;input&#39;);
  var catInput = document.getElementById(&#39;category&#39;);
  var dueInput = document.getElementById(&#39;due&#39;);

  function categorySelect(selected) {
    var s = document.createElement(&#39;select&#39;);
    CATEGORIES.forEach(function (c) {
      var o = document.createElement(&#39;option&#39;);
      o.value = o.textContent = c;
      s.appendChild(o);
    });
    s.value = selected;
    return s;
  }
  CATEGORIES.forEach(function (c) {
    var o = document.createElement(&#39;option&#39;);
    o.value = o.textContent = c;
    catInput.appendChild(o);
  });

  function save() {
    try { localStorage.setItem(&#39;todos&#39;, JSON.stringify(todos)); } catch (e) {}
  }

    var d = new Date();
    var m = (&#39;0&#39; + (d.getMonth() + 1)).slice(-2), day = (&#39;0&#39; + d.getDate()).slice(-2);
    return d.getFullYear() + &#39;-&#39; + m + &#39;-&#39; + day;
  }

  function formatDue(s) {
    var p = s.split(&#39;-&#39;);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { month: &#39;short&#39;, day: &#39;numeric&#39;, year: &#39;numeric&#39; });
  }

  function button(label, title, fn) {
    var b = document.createElement(&#39;button&#39;);
    b.type = &#39;button&#39;;
    b.textContent = label;
    b.title = title;
    b.onclick = fn;
    return b;
  }

  function renderItem(t) {
    var li = document.createElement(&#39;li&#39;);
    if (t.done) li.className = &#39;done&#39;;

    var cb = document.createElement(&#39;input&#39;);
    cb.type = &#39;checkbox&#39;;
    cb.checked = t.done;
    cb.onchange = function () { t.done = cb.checked; save(); render(); };

    var del = button(&#39;🗑️&#39;, &#39;Delete&#39;, function () {
      todos.splice(todos.indexOf(t), 1); save(); render();
    });

    if (editing === t) {
      var row = document.createElement(&#39;div&#39;);
      row.className = &#39;editrow&#39;;
      var text = document.createElement(&#39;input&#39;);
      text.type = &#39;text&#39;;
      text.value = t.text;
      var cat = categorySelect(t.category);
      var due = document.createElement(&#39;input&#39;);
      due.type = &#39;date&#39;;
      due.value = t.due;

      var finish = function (keep) {
        if (keep) {
          var v = text.value.trim();
          if (v) t.text = v;
          t.category = cat.value;
          t.due = due.value;
        }
        editing = null;
        save();
        render();
      };
      [text, cat, due].forEach(function (f) {
        f.onkeydown = function (e) {
          if (e.key === &#39;Enter&#39;) finish(true);
          else if (e.key === &#39;Escape&#39;) finish(false);
        };
      });
      var actions = document.createElement(&#39;div&#39;);
      actions.className = &#39;actions&#39;;
      actions.append(button(&#39;Save&#39;, &#39;Save&#39;, function () { finish(true); }), del);
      row.append(text, cat, due, actions);
      li.append(cb, row);
      setTimeout(function () { text.focus(); }, 0);
    } else {
      var span = document.createElement(&#39;span&#39;);
      span.className = &#39;text&#39;;
      span.textContent = t.text;
      span.title = &#39;Double-click to edit&#39;;
      span.ondblclick = function () { editing = t; render(); };
      var main = document.createElement(&#39;div&#39;);
      main.className = &#39;main&#39;;
      main.append(span);

      if (t.due) {
        var d = document.createElement(&#39;span&#39;);
        d.className = &#39;due&#39; + (!t.done &amp;&amp; t.due &lt; today() ? &#39; overdue&#39; : &#39;&#39;);
        d.textContent = (d.className.indexOf(&#39;overdue&#39;) &gt;= 0 ? &#39;Overdue · &#39; : &#39;Due &#39;) + formatDue(t.due);
        main.append(d);
      }
      li.append(cb, main);
      li.append(button(&#39;✏️&#39;, &#39;Edit&#39;, function () { editing = t; render(); }), del);
    }
    return li;
  }

  function render() {
    list.innerHTML = &#39;&#39;;

    CATEGORIES.forEach(function (name) {
      var items = todos.filter(function (t) { return t.category === name; });
      if (!items.length) return;

      var h = document.createElement(&#39;h2&#39;);
      h.textContent = name;
      var ul = document.createElement(&#39;ul&#39;);
      // soonest due date first; items without a date last (sort is stable)
      items.sort(function (a, b) {
        if (a.due === b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due &lt; b.due ? -1 : 1;
      }).forEach(function (t) { ul.appendChild(renderItem(t)); });
      list.append(h, ul);
    });
  }

  document.getElementById(&#39;form&#39;).onsubmit = function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false, category: catInput.value, due: dueInput.value });
    input.value = &#39;&#39;;
    dueInput.value = &#39;&#39;;
    save();
    render();
    input.focus();
  };

  render();
&lt;/script&gt;
&lt;/body&gt;

      actions.className = &#39;actions&#39;;
      actions.append(button(&#39;Save&#39;, &#39;Save&#39;, function () { finish(true); }), del);
      row.append(text, cat, due, actions);
      li.append(cb, row);
      setTimeout(function () { text.focus(); }, 0);
    } else {
      var span = document.createElement(&#39;span&#39;);
      span.className = &#39;text&#39;;
      span.textContent = t.text;
      span.title = &#39;Double-click to edit&#39;;
      span.ondblclick = function () { editing = t; render(); };
      var main = document.createElement(&#39;div&#39;);
      main.className = &#39;main&#39;;
      main.append(span);

      if (t.due) {
        var d = document.createElement(&#39;span&#39;);
        d.className = &#39;due&#39; + (!t.done &amp;&amp; t.due &lt; today() ? &#39; overdue&#39; : &#39;&#39;);
        d.textContent = (d.className.indexOf(&#39;overdue&#39;) &gt;= 0 ? &#39;Overdue · &#39; : &#39;Due &#39;) + formatDue(t.due);
        main.append(d);
      }
      li.append(cb, main);
      li.append(button(&#39;✏️&#39;, &#39;Edit&#39;, function () { editing = t; render(); }), del);
    }
    return li;
  }

  function render() {
    list.innerHTML = &#39;&#39;;

    CATEGORIES.forEach(function (name) {
      var items = todos.filter(function (t) { return t.category === name; });
      if (!items.length) return;

      var h = document.createElement(&#39;h2&#39;);
      h.textContent = name;
      var ul = document.createElement(&#39;ul&#39;);
      // soonest due date first; items without a date last (sort is stable)
      items.sort(function (a, b) {
        if (a.due === b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due &lt; b.due ? -1 : 1;
      }).forEach(function (t) { ul.appendChild(renderItem(t)); });
      list.append(h, ul);
    });
  }

  document.getElementById(&#39;form&#39;).onsubmit = function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false, category: catInput.value, due: dueInput.value });
    input.value = &#39;&#39;;
    dueInput.value = &#39;&#39;;
    save();
    render();
    input.focus();
  };

  render();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></div>
